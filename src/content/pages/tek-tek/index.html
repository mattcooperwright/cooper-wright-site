<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEK TEK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --f:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --bg:#08090b; --panel:rgba(11,12,15,.76);
  --ink:#e9ecf3; --dim:#7a8290; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.17);
  --neon:#ff2bd6; --neon2:#18f0ff;
  --metal:linear-gradient(#0c0d10,#0c0d10);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;background-color:#0a0b0d;
  background-image:radial-gradient(120% 60% at 50% 0%,rgba(255,43,214,.12),transparent 62%),radial-gradient(150% 100% at 50% 40%,transparent 50%,rgba(0,0,0,.65) 100%),var(--metal);
  background-size:auto,auto,256px 256px;
  color:var(--ink);font-family:var(--f);font-size:13px;line-height:1.4;
  text-transform:uppercase;letter-spacing:.07em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,canvas{font-family:var(--f);text-transform:uppercase;letter-spacing:inherit}
.wrap{max-width:560px;margin:0 auto;padding:22px 14px 48px}
h1{
  font-family:var(--f);font-weight:700;font-size:clamp(54px,17.5vw,96px);line-height:.9;
  letter-spacing:.06em;margin:0;color:#ffe6f9;
  text-shadow:0 0 3px #ffb4ef,0 0 10px var(--neon),0 0 26px var(--neon),0 0 60px rgba(255,43,214,.55);
}
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 45%),var(--panel);
  border:1px solid var(--line);border-radius:3px;padding:14px;margin-top:12px;
  box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
}
.ph{font-weight:700;font-size:15px;letter-spacing:.2em;margin:0;color:var(--neon2);text-shadow:0 0 10px rgba(24,240,255,.55)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lab{color:var(--dim);font-size:12px;font-weight:500}
.val{font-weight:700;font-size:15px;color:var(--neon2);text-shadow:0 0 9px rgba(24,240,255,.55);white-space:nowrap}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{display:flex;align-items:flex-end;gap:12px}
.big .n{font-weight:700;font-size:92px;line-height:.78;color:#e6fcff;text-shadow:0 0 4px #9ff8ff,0 0 16px var(--neon2),0 0 40px rgba(24,240,255,.5);font-variant-numeric:tabular-nums}
.big .of{color:var(--dim);font-size:12px;line-height:1.3;padding-bottom:2px}
.big .of b{display:block;color:var(--ink);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.play{
  width:62px;height:62px;border-radius:50%;flex:none;border:2px solid var(--neon);background:rgba(255,43,214,.06);color:var(--neon);
  display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 0 14px rgba(255,43,214,.5),inset 0 0 12px rgba(255,43,214,.25);
}
.play.on{background:var(--neon);color:#16000f;box-shadow:0 0 22px rgba(255,43,214,.85)}
.play svg{width:24px;height:24px;fill:currentColor}
.barmap{display:grid;grid-template-columns:repeat(64,1fr);gap:1px;height:30px;margin-top:16px}
.barmap i{background:var(--line)}
.barmap i:nth-child(33){margin-left:4px}
.barmap i.d{background:rgba(255,43,214,.45)}
.barmap i.now{background:var(--neon2);box-shadow:0 0 10px var(--neon2)}
.rail{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:12px}
.rail button{
  font:inherit;font-size:clamp(8px,2.45vw,11px);font-weight:500;letter-spacing:.03em;color:var(--dim);background:rgba(0,0,0,.25);
  border:1px solid var(--line);border-radius:3px;min-height:50px;padding:6px 0 5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;min-width:0;
}
.rail button i{font-style:normal;font-weight:700;font-size:18px;line-height:1}
.rail button.on{color:var(--ink);border-color:var(--line2)}
.rail button.on i{color:var(--neon2);text-shadow:0 0 10px var(--neon2)}
.rail button.cur{border-color:var(--neon);box-shadow:0 0 12px rgba(255,43,214,.5),inset 0 0 10px rgba(255,43,214,.2)}
.railfoot{display:flex;justify-content:flex-end;margin-top:10px}

canvas{display:block;width:100%}
#viz{height:76px;margin-top:12px}

.ctl{margin-top:16px}
.ctl.first{margin-top:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0 0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(var(--neon),var(--neon)) no-repeat 0 0/var(--fill,50%) 100%,rgba(255,255,255,.14);box-shadow:0 0 8px rgba(255,43,214,.35)}
input[type=range]::-moz-range-track{height:3px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:3px;background:var(--neon)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:26px;margin-top:-11.5px;border-radius:2px;background:#fff;border:0;box-shadow:0 0 0 2px var(--neon),0 0 12px var(--neon)}
input[type=range]::-moz-range-thumb{width:14px;height:26px;border-radius:2px;background:#fff;border:0;box-shadow:0 0 0 2px var(--neon),0 0 12px var(--neon)}
input[type=range]:focus-visible{outline:2px solid var(--neon2);outline-offset:2px}
.ends{position:relative;height:18px;color:var(--dim);font-size:11px}
.ends span{position:absolute;top:0;white-space:nowrap}
.pat{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;height:20px;margin-top:8px}
.pat i{background:rgba(255,255,255,.07);position:relative;border-radius:1px}
.pat i:nth-child(4n+1){background:rgba(255,255,255,.13)}
.pat i b{position:absolute;inset:0;background:var(--neon);opacity:var(--v,0);border-radius:1px;box-shadow:0 0 8px var(--neon)}
.pat i.now{outline:1px solid var(--neon2);outline-offset:1px}
.pat.edit{height:42px}
.pat.edit i{cursor:pointer}
.pat.edit i:focus-visible{outline:2px solid var(--neon2);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.seg.c3{grid-template-columns:repeat(3,1fr);margin-top:12px}
.btn,.seg button{
  font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:rgba(0,0,0,.28);
  border:1px solid var(--line2);border-radius:3px;min-height:42px;padding:8px 8px;cursor:pointer;
}
.btn.on,.seg button.on{border-color:var(--neon);color:#ffd9f6;background:rgba(255,43,214,.14);box-shadow:0 0 12px rgba(255,43,214,.45),inset 0 0 8px rgba(255,43,214,.22)}
.btn:focus-visible,.seg button:focus-visible,.rail button:focus-visible,.play:focus-visible,.cell:focus-visible{outline:2px solid var(--neon2);outline-offset:2px}
.btn.sm{min-height:34px;padding:5px 10px}

#strip{height:80px;margin-top:14px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:3px;touch-action:manipulation;cursor:pointer}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.cell{
  font:inherit;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:3px;
  aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;cursor:pointer;min-width:0;overflow:hidden;
}
.cell .n{font-weight:700;font-size:18px;line-height:1}
.cell .f{font-size:9px;color:var(--neon);height:12px;line-height:12px;white-space:nowrap;overflow:hidden;max-width:100%}
.cell.sel{border-color:var(--neon);box-shadow:0 0 10px rgba(255,43,214,.55),inset 0 0 0 1px var(--neon)}
.cell.empty .n{color:var(--dim)}
.cell.mute{opacity:.35}
.cell.now{background:var(--neon2);color:#021014;border-color:var(--neon2);box-shadow:0 0 14px rgba(24,240,255,.65)}
.cell.now .f{color:#021014}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tools .btn{flex:1 1 auto}
.sep{height:1px;background:var(--line);margin:18px 0 2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>TEK TEK</h1>

  <section class="panel" id="transport">
    <div class="top">
      <div class="big">
        <span class="n" id="passN">0</span>
        <span class="of">PASS<b id="barTxt">BAR 1 / 64</b></span>
      </div>
      <button class="play" id="play" aria-label="Play"></button>
    </div>
    <div class="barmap" id="barmap" aria-hidden="true"></div>
    <div class="rail" id="rail"></div>
    <div class="railfoot"><button class="btn sm" id="next">Skip pass</button></div>
  </section>

  <canvas id="viz" aria-hidden="true"></canvas>

  <section class="panel">
    <div class="ctl first">
      <div class="row"><label class="lab" for="tempo">Tempo</label><span class="val" id="tempoV"></span></div>
      <input id="tempo" type="range" min="112" max="148" value="132">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="mood">Mood</label><span class="val" id="moodV"></span></div>
      <input id="mood" type="range" min="0" max="100" value="32">
      <div class="ends"><span style="left:0">Doom</span><span style="left:70%;transform:translateX(-50%)">Hypnotic</span><span style="right:0">Clean</span></div>
    </div>
  </section>

  <section class="panel">
    <h2 class="ph">Kick</h2>
    <div class="seg c3" id="kickSeg"></div>
    <div class="pat edit" id="kickPat" role="group" aria-label="Kick steps" style="margin-top:12px"></div>
    <div class="ctl">
      <div class="row"><label class="lab" for="ghost">Ghost kicks</label><span class="val" id="ghostV"></span></div>
      <input id="ghost" type="range" min="0" max="100" value="35">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="tune">Tune</label><span class="val" id="tuneV"></span></div>
      <input id="tune" type="range" min="36" max="72" value="50">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="decay">Decay</label><span class="val" id="decayV"></span></div>
      <input id="decay" type="range" min="0" max="100" value="42">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="punch">Punch and drive</label><span class="val" id="punchV"></span></div>
      <input id="punch" type="range" min="0" max="100" value="50">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="kickRev">Kick reverb</label><span class="val" id="kickRevV"></span></div>
      <input id="kickRev" type="range" min="0" max="100" value="12">
    </div>
  </section>

  <section class="panel">
    <h2 class="ph">Snare</h2>
    <div class="seg" id="snareSeg" style="margin-top:12px"></div>
    <div class="pat edit" id="snarePat" role="group" aria-label="Snare steps" style="margin-top:12px"></div>
    <div class="ctl">
      <div class="row"><label class="lab" for="stune">Tune</label><span class="val" id="stuneV"></span></div>
      <input id="stune" type="range" min="140" max="340" value="220">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="sdecay">Decay</label><span class="val" id="sdecayV"></span></div>
      <input id="sdecay" type="range" min="0" max="100" value="45">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="snap">Snap</label><span class="val" id="snapV"></span></div>
      <input id="snap" type="range" min="0" max="100" value="60">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="snareRev">Snare reverb</label><span class="val" id="snareRevV"></span></div>
      <input id="snareRev" type="range" min="0" max="100" value="25">
    </div>
  </section>

  <section class="panel">
    <div class="row"><h2 class="ph">Voice</h2><button class="btn sm" id="reroll">New riff</button></div>
    <div class="ctl first">
      <div class="row"><label class="lab" for="vowel">Vowel</label><span class="val" id="vowelV"></span></div>
      <input id="vowel" type="range" min="0" max="100" value="50">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="choir">Choir</label><span class="val" id="choirV"></span></div>
      <input id="choir" type="range" min="1" max="6" value="4">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="throat">Throat</label><span class="val" id="throatV"></span></div>
      <input id="throat" type="range" min="0" max="100" value="45">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="breath">Breath</label><span class="val" id="breathV"></span></div>
      <input id="breath" type="range" min="0" max="100" value="15">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="vpitch">Pitch</label><span class="val" id="vpitchV"></span></div>
      <input id="vpitch" type="range" min="-12" max="12" value="0">
    </div>
    <div class="ctl">
      <div class="row"><label class="lab" for="mangle">Mangle</label><span class="val" id="mangleV"></span></div>
      <input id="mangle" type="range" min="0" max="100" value="0">
    </div>

    <div class="sep"></div>
    <div class="ctl first">
      <div class="row"><label class="lab" for="chops">Chops</label><span class="val" id="chopsV"></span></div>
      <input id="chops" type="range" min="4" max="32" value="16">
    </div>
    <canvas id="strip" aria-label="Sample slices. Tap a slice to hear it and place it in the selected step."></canvas>
    <div class="cells" id="cells"></div>
    <div class="tools">
      <button class="btn" id="tRev">Reverse step</button>
      <button class="btn" id="tRat">Double step</button>
      <button class="btn" id="tPit">Pitch step</button>
      <button class="btn" id="tMute">Mute step</button>
    </div>
    <div class="tools">
      <button class="btn" id="mChop">Chop</button>
      <button class="btn" id="mShuf">Shuffle</button>
      <button class="btn" id="mStut">Stutter</button>
      <button class="btn" id="mFlip">Flip</button>
      <button class="btn" id="mReset">Reset</button>
    </div>
    <div class="tools"><button class="btn" id="drift">Drift: re-chop every 2 bars</button></div>
  </section>
</div>

<script>
(function(){
'use strict';
var PASSES=8, BARS=64, PASS_STEPS=BARS*16;
var $=function(s){return document.querySelector(s)};
var clamp=function(x,a,b){return Math.min(b,Math.max(a,x))};
var lerp=function(a,b,t){return a+(b-a)*t};
var mtof=function(m){return 440*Math.pow(2,(m-69)/12)};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* mood slider v: Doom (0) to Hypnotic (70) to Clean (100). S.mood is darkness, S.clean is lightness. */
var S={tempo:132,snareSteps:null,stune:220,sdecay:45,snap:60,snareRev:25,moodV:32,mood:54,clean:0,ghost:35,tune:50,decay:42,punch:50,kickRev:12,
  vowel:50,choir:4,throat:45,breath:15,vpitch:0,mangle:0,
  vol:.8,n:16,seed:(Math.random()*1e9)|0,playing:false,drift:false,
  kickBase:[1,0,0,0,1,0,0,0,1,0,0,0,1,0,0,0]};
function setMood(v){S.moodV=v;S.mood=clamp(100*(1-v/70),0,100);S.clean=clamp((v-70)/30*100,0,100)}
function cl(){return S.clean/100}

/* passes run 0 to 7 */
var LAYER={kick:0,bass:1,ohat:1,hats:2,riff:3,snare:4,thunder:5,rumble:5,perc:6,pad:6,echo:7};
var LAYER_NAMES=['Build','Bass','Hats','Riff','Snare','Peak','Perc','Echo'];
function isOn(k,p){return p>=LAYER[k]}
function stepDur(){return 60/S.tempo/4}
function rootMidi(){return 33-Math.floor(S.mood/26)+Math.round(cl()*3)}
var SCALES=[[0,3,5,7,10],[0,1,3,5,7,8,10],[0,1,3,5,6,8,10]];
function currentScale(){
  if(S.clean>55)return[0,2,4,7,9];
  if(S.clean>0)return[0,2,3,5,7,9,10];
  return S.mood<34?SCALES[0]:S.mood<67?SCALES[1]:SCALES[2];
}
function scaleDeg(d){var sc=currentScale();return sc[d%sc.length]}

function mk(o){var a=[];for(var i=0;i<16;i++)a.push(0);for(var k in o)a[+k]=o[k];return a}
var SNARES=[
  {name:'Backbeat',v:mk({4:1,12:1})},
  {name:'Half-time',v:mk({8:1})},
  {name:'Broken',v:mk({4:1,10:.75,12:1,15:.5})},
  {name:'Roll',v:mk({4:1,12:1,13:.35,14:.55,15:.8})}
];
S.snareSteps=SNARES[0].v.slice();
var KICK_PRESETS=[
  {name:'Four floor',steps:[0,4,8,12]},
  {name:'Broken',steps:[0,3,6,10,13]},
  {name:'Half-time',steps:[0,8]}
];
function presetArr(p){var a=[];for(var i=0;i<16;i++)a.push(p.steps.indexOf(i)>=0?1:0);return a}
var KICK_EXTRA=[14,7,10,3,11,15,6,2,13,9,5,1];
var kickPat=[];
function kickPattern(){
  var v=[],i;for(i=0;i<16;i++)v.push(S.kickBase[i]?1:0);
  var n=Math.round(S.ghost/100*8),added=0;
  for(var j=0;j<KICK_EXTRA.length&&added<n;j++){var p=KICK_EXTRA[j];if(!S.kickBase[p]){v[p]=added<3?.7:.55;added++}}
  return v;
}
function ghostName(c){return c<8?'None':c<35?'A few':c<65?'Syncopated':c<85?'Busy':'Broken'}
function moodName(v){return v<24?'Doom':v<50?'Brooding':v<72?'Hypnotic':'Clean'}
var VOWEL_NAMES=['OO','OH','AH','EH','EE'];
function decaySec(){return lerp(.15,1.0,S.decay/100)}
function kickRevSend(){return Math.pow(S.kickRev/100,1.4)*1.1}
function mw(){return Math.pow(S.mood/100,1.6)*(1-cl())}
function reverbSec(){return lerp(2,6.5,S.mood/100)}
function kickRevSec(){return lerp(2,4,S.mood/100)}
function effKickRev(){return kickRevSend()*(1+mw()*1.5)+mw()*.45}

function satCurve(k,n){var c=new Float32Array(n||1024),d=Math.tanh(k);for(var i=0;i<c.length;i++){var x=i*2/(c.length-1)-1;c[i]=Math.tanh(k*x)/d}return c}
var KICK_CURVES=[satCurve(1.1),satCurve(1.8),satCurve(3),satCurve(5)];

/* ---------- generative material ---------- */
var riff=[],bassPat=[],bassAlt=[],percPat=[],hatVel=[];
function genAll(seed){
  var r=rng(seed);
  var w=[.45,.5,.9,.55,.5,.45,.85,.6,.45,.55,.9,.5,.5,.45,.85,.7];
  var hits=w.map(function(x){return r()<x*.72});
  var cnt=hits.filter(Boolean).length;
  [2,6,10,14,7,11,3].forEach(function(i){if(cnt<5&&!hits[i]){hits[i]=true;cnt++}});
  if(cnt>9){
    w.map(function(x,i){return i}).sort(function(a,b){return w[a]-w[b]}).forEach(function(i){if(cnt>9&&hits[i]){hits[i]=false;cnt--}});
  }
  var pool=[0,0,0,0,1,2,2,3,4];
  riff=hits.map(function(h){return h?{deg:pool[Math.floor(r()*pool.length)],oct:r()<.18?1:0,acc:r()<.3,vj:r()-.5,vd:(r()-.5)*2.4}:null});
  var f=riff.findIndex(function(x){return !!x});if(f>=0)riff[f].deg=0;
  bassPat=[];for(var i=0;i<16;i++)bassPat.push(null);
  [2,6,10,14].forEach(function(i){bassPat[i]=r()<.72?0:[1,2,3][Math.floor(r()*3)]});
  if(r()<.5)bassPat[15]=0;
  bassAlt=[];for(i=0;i<16;i++)bassAlt.push(null);
  [3,5,7,11,13,15].forEach(function(k){if(r()<.45)bassAlt[k]=[0,0,1,2][Math.floor(r()*4)]});
  hatVel=[];for(i=0;i<16;i++)hatVel.push(0);
  for(i=1;i<16;i+=2)hatVel[i]=r()<.12?0:.3+r()*.4;
  percPat=[];for(i=0;i<16;i++)percPat.push(null);
  [1,3,5,7,9,11,13,15].sort(function(){return r()-.5}).slice(0,4).forEach(function(i,k){

  KICK_PRESETS.forEach(function(p){
    var b=document.createElement('button');b.textContent=p.name;
    b.addEventListener('click',function(){S.kickBase=presetArr(p);updateKickUI();hitKick()});ks.appendChild(b);kickSegBtns.push(b);
  });
  var seg=$('#snareSeg');
  SNARES.forEach(function(s,i){
    var b=document.createElement('button');b.textContent=s.name;
    b.addEventListener('click',function(){S.snareSteps=s.v.slice();updateSnareUI();hitSnare()});seg.appendChild(b);
  });
  Array.prototype.forEach.call(snareEl.children,function(el,i){
    el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label','Snare step '+(i+1));
    var tog=function(){S.snareSteps[i]=S.snareSteps[i]?0:1;updateSnareUI();if(S.snareSteps[i])hitSnare()};
    el.addEventListener('click',tog);
    el.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();tog()}});
  });
  viz=$('#viz');vg=viz.getContext('2d');strip=$('#strip');sg=strip.getContext('2d');
  readColors();fit(viz);fit(strip);makeGrad();
  var refit=function(){readColors();fit(viz);fit(strip);makeGrad();drawStrip()};
  window.addEventListener('resize',refit);
  strip.addEventListener('pointerdown',function(e){
    var r=strip.getBoundingClientRect(),idx=clamp(Math.floor((e.clientX-r.left)/r.width*S.n),0,S.n-1),c=seq[sel];
    c.slice=idx;audition(idx,c.rev,c.pit,c.pan);sel=(sel+1)%S.n;refreshCells();
  });
  slider('tempo',function(v){S.tempo=v;$('#tempoV').textContent=v+' BPM';updateDelayTime();queueRender()});
  slider('mood',function(v){setMood(v);$('#moodV').textContent=moodName(v);applyMood();queueRender()});
  slider('ghost',function(v){S.ghost=v;$('#ghostV').textContent=ghostName(v);if(kickEl.children.length)updateKickUI()});
  slider('tune',function(v){S.tune=v;$('#tuneV').textContent=v+' HZ'},hitKick);
  slider('decay',function(v){S.decay=v;$('#decayV').textContent=Math.round(decaySec()*1000)+' MS'},hitKick);
  slider('punch',function(v){S.punch=v;$('#punchV').textContent=v+'%'},hitKick);
  slider('kickRev',function(v){S.kickRev=v;$('#kickRevV').textContent=v+'%';if(ctx)kRevSend.gain.setTargetAtTime(effKickRev(),ctx.currentTime,.03)},hitKick);
  slider('stune',function(v){S.stune=v;$('#stuneV').textContent=v+' HZ'},hitSnare);
  slider('sdecay',function(v){S.sdecay=v;$('#sdecayV').textContent=Math.round(lerp(.1,.55,v/100)*1000)+' MS'},hitSnare);
  slider('snap',function(v){S.snap=v;$('#snapV').textContent=v+'%'},hitSnare);
  slider('snareRev',function(v){S.snareRev=v;$('#snareRevV').textContent=v+'%'},hitSnare);
  slider('vowel',function(v){S.vowel=v;$('#vowelV').textContent=VOWEL_NAMES[Math.round(v/100*4)];queueRender()});
  slider('choir',function(v){S.choir=v;$('#choirV').textContent=v+(v===1?' VOICE':' VOICES');queueRender()});
  slider('throat',function(v){S.throat=v;$('#throatV').textContent=v<35?'DEEP':v<65?'MID':'BRIGHT';queueRender()});
  slider('breath',function(v){S.breath=v;$('#breathV').textContent=v+'%';queueRender()});
  slider('vpitch',function(v){S.vpitch=v;$('#vpitchV').textContent=(v>0?'+':'')+v+' ST';queueRender()});
  slider('mangle',function(v){S.mangle=v;$('#mangleV').textContent=v+'%';queueRender()});
  slider('chops',function(v){$('#chopsV').textContent=v;if(v!==S.n&&cellEls.length)setN(v)});
  $('#play').addEventListener('click',function(){if(S.playing)stop();else start()});
  $('#next').addEventListener('click',function(){
    var p=Math.min(PASSES-1,Math.floor((cur&&S.playing?cur.step:stepCount)/PASS_STEPS));
    jumpTo(p>=PASSES-1?0:p+1);
  });
  $('#reroll').addEventListener('click',function(){S.seed=(Math.random()*1e9)|0;genAll(S.seed);resetSeq();mutate(Math.max(2,Math.round(S.n/5)));queueRender()});
  $('#tRev').addEventListener('click',function(){seq[sel].rev=!seq[sel].rev;refreshCells()});
  $('#tRat').addEventListener('click',function(){seq[sel].rat=!seq[sel].rat;refreshCells()});
  $('#tMute').addEventListener('click',function(){seq[sel].mute=!seq[sel].mute;refreshCells()});
  $('#tPit').addEventListener('click',function(){var c=seq[sel],k=PIT.indexOf(c.pit);c.pit=PIT[(k+1)%PIT.length];refreshCells()});
  $('#mChop').addEventListener('click',function(){mutate(Math.max(3,Math.round(S.n/5)))});
  $('#mShuf').addEventListener('click',shuffleSeq);
  $('#mStut').addEventListener('click',stutter);
  $('#mFlip').addEventListener('click',function(){seq.reverse();refreshCells()});
  $('#mReset').addEventListener('click',function(){resetSeq();refreshCells()});
  $('#drift').addEventListener('click',function(){S.drift=!S.drift;$('#drift').classList.toggle('on',S.drift)});
  updateKickUI();updateSnareUI();
  buildCells();setPlayBtn();showPos(0);drawStrip();
}

setMood(S.moodV);
genAll(S.seed);EVT=buildEvents(S.n);resetSeq();
build();
mutate(4);
clearTimeout(renderTimer);renderRiff();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
