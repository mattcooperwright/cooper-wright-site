<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSAP sandbox test</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 24px;
           background: #111; color: #eee; font: 16px/1.5 system-ui, sans-serif; }
    .row { display: flex; gap: 16px; }
    .box { width: 64px; height: 64px; border-radius: 8px; background: #ff7f11; }
    .box:nth-child(2) { background: #8ddbe0; }
    .box:nth-child(3) { background: #e2e8ce; }
    #status { text-align: center; }
  </style>
</head>
<body>
  <div class="row"><div class="box"></div><div class="box"></div><div class="box"></div></div>
  <p id="status">GSAP did not load.</p>
  <!-- GSAP 3.15.0 (released 2026-04-13), pinned. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script>
    if (window.gsap) {
      document.getElementById('status').textContent = 'GSAP ' + gsap.version + ' loaded and animating.';
      gsap.to('.box', { x: 120, rotation: 360, duration: 1.2, ease: 'power2.inOut', stagger: 0.15, repeat: -1, yoyo: true });
    }
  </script>
</body>
</html>
